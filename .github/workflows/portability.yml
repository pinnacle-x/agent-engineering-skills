name: Portability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate portable Skill core
        run: python scripts/validate_portability.py
      - name: Validate native local tracker and living design contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          skills = sorted(p.name for p in (root / "skills").iterdir() if (p / "SKILL.md").is_file())
          assert skills == ["engineering-governance", "project-bootstrap"], skills

          bootstrap = (root / "skills/project-bootstrap/SKILL.md").read_text(encoding="utf-8")
          governance = (root / "skills/engineering-governance/SKILL.md").read_text(encoding="utf-8")
          agent = (root / "skills/project-bootstrap/references/AGENTS.template.md").read_text(encoding="utf-8")
          readme = (root / "README.md").read_text(encoding="utf-8")
          workflow = (root / "docs/workflow.md").read_text(encoding="utf-8")
          discovery = (root / "docs/document-discovery.md").read_text(encoding="utf-8")
          installation = (root / "docs/installation.md").read_text(encoding="utf-8")
          new_example = (root / "examples/new-project/README.md").read_text(encoding="utf-8")
          existing_example = (root / "examples/existing-project/README.md").read_text(encoding="utf-8")
          index_reference = (root / "skills/project-bootstrap/references/docs-index.template.md").read_text(encoding="utf-8")

          # Both entry paths and the dedicated update-design mode are independently available.
          for token in ("## Mode: bootstrap", "## Mode: update-design", "## Mode: add-rule"):
              assert token in bootstrap or (token == "## Mode: bootstrap" and "## Mode: bootstrap (default)" in bootstrap), token
          assert "**New project**" in bootstrap and "**Existing-source project**" in bootstrap
          for text in ("source", "technical constraints", "confirmed", "Pending"):
              assert text.lower() in bootstrap.lower(), text
          for name in ("architecture.template.md", "design-overview.template.md",
                       "docs-index.template.md", "AGENTS.template.md",
                       "requirements.template.md", "technical-constraints.template.md",
                       "rules.template.md"):
              assert (root / "skills/project-bootstrap/references" / name).is_file(), name
          assert "## Mode: update-design" in bootstrap
          assert "$project-bootstrap update-design" in readme + installation
          assert "sync" in workflow.lower() and "architecture" in existing_example.lower()

          # Upstream native local Markdown is authoritative for Map, tickets and task spec.
          for token in ("setup-matt-pocock-skills", "Local Markdown",
                        ".scratch/<effort>/map.md", ".scratch/<feature>/spec.md",
                        "docs/agents/issue-tracker.md", "docs/agents/domain.md",
                        ".gitignore"):
              assert token in bootstrap, token
          assert "wayfinder" in new_example.lower() and "to-spec" in new_example
          assert ".scratch/" in discovery and "local markdown" in discovery.lower()
          assert "no extra" in readme.lower() or "not a mandatory" in readme.lower()
          assert "do not" in index_reference.lower() and "automatically" in index_reference.lower()

          # Project instructions point at current design and upstream discovery, not every task spec.
          for path in ("docs/architecture.md", "docs/design-overview.md",
                       "docs/agents/issue-tracker.md", "docs/agents/domain.md",
                       ".agents/rules/"):
              assert path in agent, path
          assert "when present" in agent
          assert "does **not** create an empty" in bootstrap
          assert "never update root" in bootstrap.lower()
          assert "## Mode: change-impact" not in governance
          for mode in ("verify", "release"):
              assert f"## Mode: {mode}" in governance
          assert "Single Git" in governance and "Multi Git" in governance
          assert "architecture" in governance.lower() and "spec" in governance.lower()

          # Named execution workflow intermediaries are not part of our instructions.
          for path in ("README.md", "docs/workflow.md", "skills/project-bootstrap/SKILL.md",
                       "skills/engineering-governance/SKILL.md"):
              doc = (root / path).read_text(encoding="utf-8").lower()
              assert "$implement" not in doc and "$tdd" not in doc

          meta = json.loads((root / ".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert meta["version"] == "0.9.0"
          assert any("update-design" in prompt for prompt in meta["interface"]["defaultPrompt"])
          for old in ("skills/cross-repo-governance", "templates/CHANGE_IMPACT.md",
                      "examples/change-impact", "docs/cross-repo-workflow.md"):
              assert not (root / old).exists(), old
          print("Local Markdown and living design contract: PASS")
          PY
      - name: Smoke-test generic user install
        run: |
          HOME="$RUNNER_TEMP/agent-skills-home" python scripts/install.py --agent generic --scope user
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/SKILL.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/AGENTS.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/architecture.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/design-overview.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/docs-index.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/rules.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/requirements.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/technical-constraints.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/engineering-governance/SKILL.md"
          test ! -e "$RUNNER_TEMP/agent-skills-home/.agents/skills/cross-repo-governance"
          test ! -d "$RUNNER_TEMP/agent-skills-home/.agents/rules"
          test ! -e "$RUNNER_TEMP/agent-skills-home/.scratch"
      - name: Smoke-test independent Skill selection
        run: |
          HOME="$RUNNER_TEMP/bootstrap-only" python scripts/install.py --agent generic --scope user --skill project-bootstrap
          test -f "$RUNNER_TEMP/bootstrap-only/.agents/skills/project-bootstrap/references/architecture.template.md"
          test -f "$RUNNER_TEMP/bootstrap-only/.agents/skills/project-bootstrap/references/design-overview.template.md"
          test ! -e "$RUNNER_TEMP/bootstrap-only/.agents/skills/engineering-governance"
          HOME="$RUNNER_TEMP/governance-only" python scripts/install.py --agent generic --scope user --skill engineering-governance
          test -f "$RUNNER_TEMP/governance-only/.agents/skills/engineering-governance/SKILL.md"
          test ! -e "$RUNNER_TEMP/governance-only/.agents/skills/project-bootstrap"
