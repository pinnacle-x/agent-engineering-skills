name: Portability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate portable Skill core
        run: python scripts/validate_portability.py
      - name: Validate Skill contract and documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          assert sorted(p.name for p in (root / "skills").iterdir() if (p / "SKILL.md").is_file()) == [
              "engineering-governance", "project-bootstrap"
          ]
          bootstrap = (root / "skills/project-bootstrap/SKILL.md").read_text()
          governance = (root / "skills/engineering-governance/SKILL.md").read_text()
          template = (root / "skills/project-bootstrap/references/AGENTS.template.md").read_text()
          readme = (root / "README.md").read_text()
          assert "## Mode: add-rule" in bootstrap
          assert ".agents/rules/" in bootstrap and "Do not create an empty" in bootstrap
          assert "Never update root" in bootstrap and "AGENTS.md" in bootstrap
          assert "individual rule files" in bootstrap and "per-rule index in AGENTS.md" in bootstrap
          assert "does not enumerate rules" in template
          assert "Do not assume the runtime automatically loads" in template
          assert ".agents/rules/<topic>.md" in (root / "skills/project-bootstrap/references/rules.template.md").read_text()
          assert ".agents/rules/INDEX.md" in (root / "skills/project-bootstrap/references/rules.template.md").read_text()
          assert ".agents/rules/stm32-dma.md" not in template
          assert "link each rule" not in readme
          assert "stable pointer to `.agents/rules/`" in readme
          assert "Do not modify `AGENTS.md` for rule maintenance" in (root / "docs/project-bootstrap.md").read_text()
          for mode in ("change-impact", "verify", "release"):
              assert f"## Mode: {mode}" in governance
          assert "single Git" in governance and "multiple Git" in governance
          assert "no minimum-documentation" in governance.lower() or "no minimum-documentation restriction" in governance.lower()
          assert "$project-bootstrap add-rule" in readme
          assert "$engineering-governance" in readme
          meta = json.loads((root / ".codex-plugin/plugin.json").read_text())
          assert meta["name"] == "engineering-agent-skills"
          assert meta["version"] == "0.6.0"
          for old in ("skills/cross-repo-governance", "templates/INTERFACE_CHANGE.md",
                      "docs/cross-repo-workflow.md", "examples/interface-change",
                      "examples/manifest-release"):
              assert not (root / old).exists(), old
          print("Skill contract and documentation: PASS")
          PY
      - name: Smoke-test generic user install
        run: |
          HOME="$RUNNER_TEMP/agent-skills-home" python scripts/install.py --agent generic --scope user
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/SKILL.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/AGENTS.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/project-bootstrap/references/rules.template.md"
          test -f "$RUNNER_TEMP/agent-skills-home/.agents/skills/engineering-governance/SKILL.md"
          test ! -e "$RUNNER_TEMP/agent-skills-home/.agents/skills/cross-repo-governance"
          test ! -d "$RUNNER_TEMP/agent-skills-home/.agents/rules"
      - name: Smoke-test independent Skill selection
        run: |
          HOME="$RUNNER_TEMP/bootstrap-only" python scripts/install.py --agent generic --scope user --skill project-bootstrap
          test -f "$RUNNER_TEMP/bootstrap-only/.agents/skills/project-bootstrap/SKILL.md"
          test ! -e "$RUNNER_TEMP/bootstrap-only/.agents/skills/engineering-governance"
          HOME="$RUNNER_TEMP/governance-only" python scripts/install.py --agent generic --scope user --skill engineering-governance
          test -f "$RUNNER_TEMP/governance-only/.agents/skills/engineering-governance/SKILL.md"
          test ! -e "$RUNNER_TEMP/governance-only/.agents/skills/project-bootstrap"
